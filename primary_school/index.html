<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同学录 · 青春的葬礼</title>
    <!-- 引入 common.js，自动拦截未登录用户 -->
    <script src="common.js"></script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            line-height: 1.5;
        }

        /* ===== 主容器：网格布局 ===== */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 40px 45px 35px 45px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            grid-template-rows: auto auto 1fr auto;
            gap: 20px 30px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9);
        }

        /* ===== 左上：年份 / 装饰 ===== */
        .year {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            font-size: 14px;
            letter-spacing: 6px;
            color: #555;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
            align-self: end;
        }
        .year span {
            color: #888;
            font-weight: 300;
        }

        /* ===== 右上：符号装饰 ===== */
        .symbol {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            text-align: right;
            font-size: 28px;
            color: #333;
            letter-spacing: 8px;
            align-self: end;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        /* ===== 左栏：主标题 + 副标题 ===== */
        .title-group {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 10px;
            border-right: 1px solid #1e1e1e;
        }

        .main-title {
            font-size: 68px;
            font-weight: 300;
            letter-spacing: 14px;
            color: #ffffff;
            line-height: 1.1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.04);
            margin-bottom: 18px;
        }
        .main-title .small {
            display: block;
            font-size: 28px;
            letter-spacing: 10px;
            color: #777;
            font-weight: 200;
            margin-top: 6px;
        }

        .sub {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 6px;
            color: #888;
            font-style: italic;
            border-top: 1px solid #2a2a2a;
            padding-top: 18px;
            margin-top: 4px;
        }

        /* ===== 右栏：正文 / 挽词 ===== */
        .eulogy {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            padding: 6px 0 0 0;
            align-self: center;
        }
        .eulogy p {
            font-size: 17px;
            font-weight: 300;
            line-height: 2.2;
            color: #cdcdcd;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }
        .eulogy p:last-child {
            margin-bottom: 0;
        }
        .eulogy .quote {
            color: #aaa;
            font-style: italic;
            letter-spacing: 2px;
        }
        .eulogy .finale {
            color: #999;
            font-style: italic;
            letter-spacing: 1.5px;
            margin-top: 10px;
            border-top: 1px solid #222;
            padding-top: 16px;
        }

        /* ===== 右栏下方：链接 + 日期 ===== */
        .action {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding-top: 20px;
            border-top: 1px solid #1e1e1e;
            margin-top: 10px;
        }

        .nav-link {
            display: inline-block;
            padding: 10px 36px;
            border: 1px solid #666;
            background: transparent;
            color: #f0f0f0;
            font-family: inherit;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .nav-link:hover {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #fff;
            letter-spacing: 12px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.06);
        }
        .nav-link::after {
            content: " →";
            letter-spacing: 0;
            transition: letter-spacing 0.3s ease;
        }
        .nav-link:hover::after {
            letter-spacing: 4px;
        }

        .footer-meta {
            font-size: 13px;
            color: #555;
            letter-spacing: 4px;
            font-weight: 300;
            margin-top: 4px;
        }
        .footer-meta .date {
            color: #666;
            font-style: italic;
        }

        /* ===== 底部跨栏：格言 + 页脚链接 ===== */
        .motto {
            grid-column: 1 / 3;
            grid-row: 4 / 5;
            border-top: 1px solid #1a1a1a;
            padding-top: 22px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .motto .slogan {
            font-size: 13px;
            letter-spacing: 8px;
            color: #3a3a3a;
            font-weight: 200;
        }
        .motto .footer-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 300;
            transition: opacity 0.2s ease;
            border: none; /* 确保无外框 */
            background: transparent;
        }
        .motto .footer-link:hover {
            opacity: 0.7;
        }

        /* ===== 响应式：小屏改为纵向 ===== */
        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto auto auto;
                gap: 16px;
                padding: 28px 20px;
                border: none;
                border-radius: 0;
                background: #000;
                box-shadow: none;
            }
            .year {
                grid-column: 1 / 2;
                grid-row: 1 / 2;
                border-bottom: 1px solid #222;
                text-align: left;
                padding-bottom: 10px;
            }
            .symbol {
                grid-column: 1 / 2;
                grid-row: 2 / 3;
                text-align: left;
                border-bottom: none;
                padding-bottom: 0;
                font-size: 20px;
            }
            .title-group {
                grid-column: 1 / 2;
                grid-row: 3 / 4;
                border-right: none;
                padding-right: 0;
            }
            .main-title {
                font-size: 44px;
                letter-spacing: 10px;
            }
            .main-title .small {
                font-size: 22px;
                letter-spacing: 6px;
            }
            .eulogy {
                grid-column: 1 / 2;
                grid-row: 4 / 5;
                padding: 0;
            }
            .action {
                grid-column: 1 / 2;
                grid-row: 5 / 6;
                border-top: 1px solid #222;
                margin-top: 0;
                padding-top: 18px;
                align-items: stretch;
            }
            .nav-link {
                text-align: center;
            }
            .motto {
                grid-column: 1 / 2;
                grid-row: 6 / 7;
                border-top: 1px solid #222;
                margin-top: 0;
                padding-top: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 左上：年份 -->
        <div class="year">2026 · <span>七月</span></div>

        <!-- 右上：符号 -->
        <div class="symbol">✧ ✦ ✧</div>

        <!-- 左栏：标题组 -->
        <div class="title-group">
            <div class="main-title">
                同学录
                <span class="small">青春的葬礼</span>
            </div>
            <div class="sub">— 致我们终将逝去的 —</div>
        </div>

        <!-- 右栏：正文 -->
        <div class="eulogy">
            <p>那些被风吹散的名字，<br />在时光的褶皱里重新发光。</p>
            <p>我们曾共用同一片晚霞，<br />如今各自走向各自的晨曦。</p>
            <p class="quote">—— 此间少年，永不谢幕 ——</p>
            <p class="finale">宇宙很大，生活更大，我们一定还能相见的。</p>
        </div>

        <!-- 右栏：链接 + 日期 -->
        <div class="action">
            <a href="namelist.html" class="nav-link">查看名录</a>
            <div class="footer-meta">
                <span class="date">2026.07.27</span>  ·  永恒 · 纪念
            </div>
        </div>

        <!-- 底部跨栏：格言 + 页脚链接 -->
        <div class="motto">
            <div class="slogan">· 青春 · 记忆 · 重逢 ·</div>
            <a href="about.html" class="footer-link">同学录 • 帮助</a>
        </div>

    </div>

</body>
</html>
