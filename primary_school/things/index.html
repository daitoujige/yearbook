<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>班级趣事 · 同学录</title>

    <!-- 登录拦截脚本（保留，由外部引入） -->
    <script src="sign_in.js"></script>

    <!-- 引入 Supabase 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ---------- 全局重置 & 黑底白字 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: "Segoe UI", "PingFang SC", Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* ---------- 标题区块（带背景框） ---------- */
        .header-block {
            width: 100%;
            max-width: 820px;
            margin-bottom: 1.2rem;
            background: #1a1a1a;
            border-radius: 28px;
            padding: 1.8rem 2.2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px #2a2a2a inset;
        }

        .header-block h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f0f0 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }

        .header-block .sub {
            font-size: 1rem;
            color: #8a8a8a;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .header-block .sub .login-badge {
            font-size: 0.7rem;
            background: #222;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            color: #6f6;
            border: 1px solid #2a4a2a;
        }

        /* ---------- 返回按钮（有外框，位于标题框下方） ---------- */
        .back-nav {
            width: 100%;
            max-width: 820px;
            margin-bottom: 1.8rem;
            display: flex;
            justify-content: flex-start;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 0.5rem 1.4rem;
            color: #8a8aff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.25s ease;
            box-shadow: 0 0 0 1px #2a2a2a inset;
        }

        .back-btn:hover {
            background: #2a2a2a;
            border-color: #555;
            transform: translateX(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        /* ---------- 文章列表区块：无框（背景透明） ---------- */
        .list-block {
            width: 100%;
            max-width: 820px;
            background: transparent;
            padding: 0.2rem 0;
        }

        .list-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #666;
            margin-bottom: 1.2rem;
            font-weight: 500;
            padding-left: 0.2rem;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        /* ---------- 文章按钮样式（与 Things 页一致） ---------- */
        .article-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 1rem 1.6rem;
            text-decoration: none;
            color: #f0f0f0;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .article-btn:hover {
            background: #2b2b2b;
            border-color: #555;
            transform: translateX(6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .article-btn .num {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4a4a4a;
            min-width: 2.8rem;
            text-align: center;
            transition: color 0.25s;
        }

        .article-btn:hover .num {
            color: #8a8aff;
        }

        /* 标题前增加半透明白色圆点图标 */
        .article-btn .title {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .article-btn .title::before {
            content: "●";
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1;
            opacity: 0.5;
            margin-right: 0.1rem;
        }

        .article-btn .arrow {
            font-size: 1.2rem;
            color: #444;
            transition: transform 0.25s, color 0.25s;
        }

        .article-btn:hover .arrow {
            transform: translateX(4px);
            color: #8a8aff;
        }

        /* ---------- 空状态 & 错误提示 ---------- */
        .empty-state,
        .error-state {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: #777;
            font-size: 1rem;
            border: 1px dashed #333;
            border-radius: 16px;
            background: #141414;
        }

        .error-state {
            color: #f66;
            border-color: #5a2a2a;
        }

        /* ---------- 底部 ---------- */
        .footer-note {
            width: 100%;
            max-width: 820px;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid #222;
            font-size: 0.8rem;
            color: #555;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .footer-note code {
            background: #1a1a1a;
            padding: 0.1rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #777;
            border: 1px solid #2a2a2a;
        }

        @media (max-width: 600px) {
            .header-block {
                padding: 1.2rem 1.2rem;
            }
            .header-block h1 {
                font-size: 1.8rem;
            }
            .back-btn {
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
            }
            .article-btn {
                padding: 0.7rem 1rem;
            }
            .article-btn .num {
                font-size: 1.3rem;
                min-width: 2.2rem;
            }
            .article-btn .title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    1. 标题区块（带背景框）
    ============================================================ -->
    <div class="header-block">
        <h1>📖 班级趣事</h1>
        <p class="sub">
            <span>那些年我们一起经历的点点滴滴</span>
            <span class="login-badge" id="loginBadge">⏳ 检查中...</span>
        </p>
    </div>

    <!-- ============================================================
    2. 返回主页按钮（有外框，位于标题框下方）
    ============================================================ -->
    <div class="back-nav">
        <a href="https://daitoujige.github.io/yearbook/primary_school/things" class="back-btn">
            ← 返回同学录主页
        </a>
    </div>

    <!-- ============================================================
    3. 文章列表容器（#storyList 已预留）
    ============================================================ -->
    <div class="list-block">
        <div class="list-label">📄 文章列表</div>
        <div class="article-list" id="storyList">
            <!-- 由 JavaScript 动态渲染 -->
            <div class="empty-state">⏳ 加载中...</div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer-note">
        <span>⚡ 登录状态由 <code>sign_in.js</code> 控制 · 数据来自 Supabase</span>
    </div>

    <!-- ============================================================
    4. Supabase 初始化 & 数据加载脚本（仅新增逻辑，不改动已有样式）
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- Supabase 配置（已提供，修正 URL） ----------
            const SUPABASE_URL = 'https://rpmtgbxbeozqtjaubexs.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_kji7RPyknvsTQAWWpLySHA_UuQi0pjq';

            // 初始化 Supabase 客户端（如果全局已有则复用）
            if (typeof supabaseClient === 'undefined') {
                window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }

            // ---------- DOM 引用 ----------
            const listContainer = document.getElementById('storyList');
            const badge = document.getElementById('loginBadge');

            // ---------- 登录状态徽章（复用 sign_in.js 逻辑） ----------
            function updateBadge(loggedIn) {
                if (loggedIn) {
                    badge.textContent = '✅ 已登录';
                    badge.style.color = '#6f6';
                    badge.style.borderColor = '#2a5a2a';
                } else {
                    badge.textContent = '❌ 未登录';
                    badge.style.color = '#f66';
                    badge.style.borderColor = '#5a2a2a';
                }
            }

            function checkLogin() {
                // 尝试从 window 上获取 sign_in.js 暴露的函数
                const candidates = [
                    window.isLoggedIn,
                    window.checkLogin,
                    window.getLoginStatus,
                    window.checkLoginStatus
                ];
                for (const fn of candidates) {
                    if (typeof fn === 'function') {
                        try {
                            const result = fn();
                            if (result && typeof result.then === 'function') {
                                result.then(function(val) { updateBadge(!!val); }).catch(function() { updateBadge(
                                    false); });
                                return;
                            }
                            updateBadge(!!result);
                            return;
                        } catch (e) {
                            console.warn('[班级趣事] 调用登录检查失败:', e);
                            updateBadge(false);
                            return;
                        }
                    }
                }
                // 默认未登录
                updateBadge(false);
            }

            // ---------- 加载文章列表（核心逻辑，与示例一致） ----------
            async function loadStories() {
                try {
                    // 显示加载状态
                    listContainer.innerHTML = '<div class="empty-state">⏳ 加载中...</div>';

                    // 查询 Supabase 表 stories，获取 id 和 title，按 id 降序
                    const { data, error } = await window.supabaseClient
                        .from('stories')
                        .select('id, title')
                        .order('id', { ascending: false });

                    // 处理错误
                    if (error) {
                        console.error('[班级趣事] Supabase 查询失败:', error);
                        listContainer.innerHTML = `
                            <div class="error-state">❌ 加载失败，请稍后重试。<br>
                            <span style="font-size:0.8rem;color:#555;">${error.message || ''}</span></div>
                        `;
                        return;
                    }

                    // 无数据
                    if (!data || data.length === 0) {
                        listContainer.innerHTML = `
                            <div class="empty-state">📭 还没有趣事，快来添加吧！</div>
                        `;
                        return;
                    }

                    // 渲染列表：每项显示 #id 和 标题，点击跳转 story.html?id=xxx
                    let html = '';
                    data.forEach(function(item) {
                        const id = item.id;
                        const title = item.title || '（无标题）';
                        // 对标题进行 HTML 转义，防止 XSS
                        const safeTitle = title.replace(/[&<>"]/g, function(m) {
                            if (m === '&') return '&amp;';
                            if (m === '<') return '&lt;';
                            if (m === '>') return '&gt;';
                            if (m === '"') return '&quot;';
                            return m;
                        });
                        html += `
                            <a class="article-btn" href="story.html?id=${id}">
                                <span class="num">#${String(id).padStart(2, '0')}</span>
                                <span class="title">${safeTitle}</span>
                                <span class="arrow">→</span>
                            </a>
                        `;
                    });
                    listContainer.innerHTML = html;

                } catch (err) {
                    console.error('[班级趣事] 加载异常:', err);
                    listContainer.innerHTML = `
                        <div class="error-state">❌ 加载失败，请检查网络连接。<br>
                        <span style="font-size:0.8rem;color:#555;">${err.message || ''}</span></div>
                    `;
                }
            }

            // ---------- 页面初始化 ----------
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    checkLogin();
                    loadStories();
                });
            } else {
                checkLogin();
                loadStories();
            }

            // 暴露刷新方法，方便调试
            window.refreshStories = loadStories;
            window.refreshLoginBadge = checkLogin;

            console.log('[班级趣事] 页面已初始化。');
        })();
    </script>

</body>
</html>
