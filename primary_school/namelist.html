<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同学录</title>

    <script>
        (function () {
            const isLoggedIn = sessionStorage.getItem('is_logged_in');
            if (!isLoggedIn || isLoggedIn !== 'true') {
                window.location.href = 'login.html';
                throw new Error('未登录，已跳转');
            }
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- 已删除 <link rel="icon" ...> 标签 -->

    <style>
        /* ---------- 完整深色主题样式 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #ddd; font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; padding: 24px 16px 60px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1320px; width: 100%; }
        .header { text-align: center; padding: 40px 0 32px; border-bottom: 1px solid #2a2a2a; margin-bottom: 32px; }
        .header .school { font-size: 14px; letter-spacing: 4px; color: #777; text-transform: uppercase; margin-bottom: 6px; }
        .header h1 { font-size: 38px; font-weight: 700; letter-spacing: 2px; color: #bbb; margin-bottom: 4px; }
        .header h1 span { color: #9a8b7a; }
        .header .sub { font-size: 18px; color: #888; letter-spacing: 6px; margin-top: 4px; }
        .header .tagline { margin-top: 14px; font-size: 15px; color: #555; letter-spacing: 2px; }
        .stats { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px 40px; padding: 20px 0 28px; border-bottom: 1px solid #1e1e1e; margin-bottom: 36px; }
        .stats .stat-item { display: flex; align-items: baseline; gap: 6px; font-size: 15px; color: #888; }
        .stats .stat-item .num { font-size: 28px; font-weight: 700; color: #ccc; margin-right: 2px; }
        .stats .stat-item .num.gold { color: #b8a68b; }
        .stats .stat-item .num.pink { color: #b08a8a; }
        .stats .stat-item .num.blue { color: #7a9bb5; }
        .stats .stat-divider { color: #333; font-size: 20px; }
        .stats .pdf-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .stats .pdf-btn:hover:not(:disabled) { background: #222; border-color: #888; color: #fff; }
        .stats .pdf-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .stats .pdf-btn.disabled { opacity: 0.4; pointer-events: none; cursor: not-allowed; }
        .logout-btn { background: transparent; border: 1px solid #664444; color: #aa8888; padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; margin-left: 10px; }
        .logout-btn:hover { background: #2a1a1a; border-color: #aa6666; color: #ffaaaa; }
        .section-title { font-size: 26px; font-weight: 600; color: #ccc; margin-bottom: 24px; padding-bottom: 8px; border-bottom: 2px solid #5a4f42; display: inline-block; letter-spacing: 1px; }
        .section-title .sub { font-size: 16px; font-weight: 400; color: #777; margin-left: 12px; }
        .section-title.dim { border-bottom-color: #3a3a3a; }
        .section-title.dim .sub { color: #666; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 48px; }
        .card { background: #141414; border-radius: 14px; padding: 18px 20px 20px; border: 1px solid #262626; transition: border-color 0.2s, transform 0.15s; display: flex; flex-direction: column; }
        .card:hover { border-color: #444; transform: translateY(-2px); }
        .card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .card .id { font-size: 13px; font-weight: 600; color: #666; background: #1e1e1e; padding: 0 8px; border-radius: 4px; line-height: 22px; }
        .card .name { font-size: 20px; font-weight: 700; color: #eee; letter-spacing: 1px; }
        .card .gender { font-size: 14px; background: #1e2a3a; padding: 0 10px; border-radius: 12px; line-height: 22px; color: #6cb4ee; margin-left: auto; font-weight: 500; }
        .card .gender.female { background: #2a1e2a; color: #c9a0a0; }
        .card .desc { font-size: 14px; line-height: 1.7; color: #bbb; margin-top: 4px; word-break: break-word; }
        .card .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; }
        .card .tags .tag { font-size: 12px; background: #1c1c1c; color: #999; padding: 0 10px; border-radius: 10px; line-height: 22px; border: 1px solid #444; display: inline-flex; align-items: center; gap: 4px; }
        .card .tags .tag i { color: #888; font-size: 12px; width: 1.2em; }
        .card.leave { background: #0e0e0e; border-color: #2a1a1a; opacity: 0.7; }
        .card.leave .name { color: #888; }
        .card.leave .id { background: #1a0e0e; color: #555; }
        .card.leave .gender { background: #1a1414; color: #776666; }
        .card.leave .desc { color: #777; }
        .card.leave .tags .tag { background: #141010; color: #665555; border-color: #2a1a1a; }
        .card.leave .tags .tag i { color: #665555; }
        .footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid #1a1a1a; text-align: center; font-size: 13px; color: #444; letter-spacing: 1px; }
        .footer .note { margin-top: 8px; font-size: 12px; color: #333; }
        .footer .home-btn { display: inline-block; margin-top: 12px; background: transparent; border: 1px solid #446666; color: #88aaaa; padding: 6px 16px; border-radius: 20px; font-size: 14px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .footer .home-btn:hover { background: #1a2a2a; border-color: #88aaaa; color: #ccffff; }
        .loading { text-align: center; padding: 60px 20px; color: #666; font-size: 18px; }
        .loading i { margin-right: 8px; }
        @media (max-width: 640px) { body { padding: 12px 10px 40px; } .header h1 { font-size: 26px; } .header .sub { font-size: 14px; letter-spacing: 3px; } .stats { gap: 10px 20px; padding: 14px 0 20px; } .stats .stat-item { font-size: 13px; } .stats .stat-item .num { font-size: 22px; } .section-title { font-size: 20px; } .grid { grid-template-columns: 1fr; gap: 14px; } .card .name { font-size: 18px; } .card .desc { font-size: 13px; } .stats .pdf-btn, .logout-btn { font-size: 12px; padding: 4px 12px; } .footer .home-btn { font-size: 12px; padding: 4px 12px; } }
        @media (min-width: 641px) and (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>

<body>
    <div class="container" id="app">
        <div id="header"></div>
        <div id="stats" class="stats"></div>
        <h2 class="section-title" id="activeTitle">
            一起存活到毕业的
            <span class="sub" id="activeCount">0 人</span>
        </h2>
        <div class="grid" id="activeGrid"></div>
        <h2 class="section-title dim" id="leftTitle">
            已离开的
            <span class="sub" id="leftCount">0 人 · 曾属于这个集体</span>
        </h2>
        <div class="grid" id="leftGrid"></div>
        <div class="footer">
            <div id="footerText">同学录</div>
            <div class="note">部分内容由 AI 辅助整理 · 保留原始记录</div>
            <a href="index.html" class="home-btn"><i class="fas fa-home"></i> 返回主页</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rpmtgbxbeozqtjaubexs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kji7RPyknvsTQAWWpLySHA_UuQi0pjq';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getCurrentUser() {
            const userInfo = sessionStorage.getItem('user_info');
            if (!userInfo) return null;
            try { return JSON.parse(userInfo); } catch { return null; }
        }

        function logout() {
            sessionStorage.removeItem('is_logged_in');
            sessionStorage.removeItem('user_info');
            window.location.href = 'login.html';
        }

        // ============================================================
        // ★★★ 新增：强制下载 PDF 函数 ★★★
        // ============================================================
        async function downloadPDF(url) {
            if (!url || url === '#') {
                alert('PDF 文件暂不可用');
                return;
            }

            // 获取按钮元素，用于显示状态
            const btn = document.querySelector('.pdf-btn:not([disabled])');
            let originalText = '';

            try {
                if (btn) {
                    originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 下载中...';
                    btn.disabled = true;
                }

                // 用 fetch 获取文件
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // 转为 Blob
                const blob = await response.blob();

                // 创建临时下载链接并触发下载
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = '同学录.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 释放内存
                setTimeout(() => URL.revokeObjectURL(link.href), 2000);

            } catch (error) {
                console.error('下载失败:', error);
                alert('下载失败，请稍后重试。\n错误信息：' + error.message);
            } finally {
                // 恢复按钮
                if (btn) {
                    btn.innerHTML = originalText || '<i class="fas fa-file-pdf"></i> 下载 PDF';
                    btn.disabled = false;
                }
            }
        }

        function renderPage(data) {
            const cls = data.class;
            const active = data.active_students || [];
            const left = data.left_students || [];

            document.getElementById('header').innerHTML = `
                <header class="header">
                    <div class="school">${cls.school}</div>
                    <h1>${cls.grade}(${cls.class_name}) · <span>同学录</span></h1>
                    <div class="sub">${cls.year} 届</div>
                    <div class="tagline">「 ${cls.intro} 」</div>
                </header>
            `;

            const male = active.filter(s => s.gender === '男').length;
            const female = active.filter(s => s.gender === '女').length;
            const pdfUrl = data.pdf_signed_url || '#';
            const pdfDisabled = !data.pdf_signed_url ? 'disabled' : '';

            document.getElementById('stats').innerHTML = `
                <div class="stat-item"><span class="num gold">${active.length}</span> 在校</div>
                <div class="stat-divider">·</div>
                <div class="stat-item"><span class="num blue">${male}</span> 男</div>
                <div class="stat-divider">·</div>
                <div class="stat-item"><span class="num pink">${female}</span> 女</div>
                <div class="stat-divider">·</div>
                <div class="stat-item"><span class="num" style="color:#666;">${left.length}</span> 已离开</div>
                <div style="flex:1; text-align:right; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
                    <!-- ★★★ 改用按钮 + onclick 调用 downloadPDF ★★★ -->
                    <button onclick="downloadPDF('${pdfUrl}')" class="pdf-btn ${pdfDisabled}" ${pdfDisabled ? 'disabled' : ''}>
                        <i class="fas fa-file-pdf"></i> 下载 PDF
                    </button>
                    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出</button>
                </div>
            `;

            document.getElementById('activeCount').textContent = active.length + ' 人';
            document.getElementById('activeGrid').innerHTML = active.map(s => buildCard(s, false)).join('');
            document.getElementById('leftCount').textContent = left.length + ' 人 · 曾属于这个集体';
            document.getElementById('leftGrid').innerHTML = left.map(s => buildCard(s, true)).join('');
            document.getElementById('footerText').textContent = `${cls.school} · ${cls.grade}(${cls.class_name}) ${cls.year} 届同学录`;
        }

        function buildCard(student, isLeave) {
            const idStr = student.id || '--';
            const genderClass = student.gender === '女' ? ' female' : '';
            const leaveClass = isLeave ? ' leave' : '';
            let tagsHTML = '';
            if (student.birthday) tagsHTML += `<span class="tag birth"><i class="fas fa-cake-candles"></i> ${student.birthday}</span>`;
            if (student.nickname) tagsHTML += `<span class="tag nick"><i class="fas fa-tag"></i> ${student.nickname}</span>`;
            if (student.height) tagsHTML += `<span class="tag"><i class="fas fa-ruler"></i> ${student.height}</span>`;
            if (!isLeave) {
                const roleKeywords = ['班长', '数学组长', '作者', '英语组长'];
                for (const kw of roleKeywords) {
                    if (student.desc && student.desc.includes(kw)) {
                        tagsHTML += `<span class="tag role"><i class="fas fa-award"></i> ${kw}</span>`;
                        break;
                    }
                }
            }
            if (!tagsHTML) tagsHTML = '<span class="tag">·</span>';
            return `
                <div class="card${leaveClass}">
                    <div class="top">
                        <span class="id">#${idStr}</span>
                        <span class="name">${student.name || '未知'}</span>
                        <span class="gender${genderClass}">${student.gender || ''}</span>
                    </div>
                    <div class="desc">${student.desc || ''}</div>
                    <div class="tags">${tagsHTML}</div>
                </div>
            `;
        }

        async function loadData() {
            document.getElementById('header').innerHTML = `
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
            `;

            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const { data, error } = await supabaseClient.rpc('get_my_class_data', {
                    p_user_id: user.id
                });

                if (error) {
                    console.error('RPC 调用失败:', error);
                    alert('数据加载失败，请稍后重试。\n错误详情：' + error.message);
                    return;
                }

                if (!data || !data.success) {
                    alert(data?.message || '无权限访问此班级数据');
                    return;
                }

                // 获取公开链接
                const { data: publicUrlData } = supabaseClient.storage
                    .from('class-files')
                    .getPublicUrl('namelist.pdf');

                data.pdf_signed_url = publicUrlData.publicUrl;

                renderPage(data);

            } catch (err) {
                console.error('加载过程异常:', err);
                alert('发生未知错误，请刷新页面重试。');
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }
    </script>
</body>
</html>
